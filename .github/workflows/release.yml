name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v2.0.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          semver="${{ steps.v.outputs.semver }}"
          short="${{ steps.v.outputs.short }}"
          date="${{ steps.v.outputs.date }}"

          name="md-cli_${semver}_${{ matrix.goos }}_${{ matrix.goarch }}"
          ext=""
          if [ "${{ matrix.goos }}" = windows ]; then ext=".exe"; fi

          mkdir -p "$name"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${semver} -X main.commit=${short} -X main.date=${date}" \
            -o "$name/md-cli${ext}" ./cmd/md-cli

          cp README.md LICENSE "$name/"

          if [ "${{ matrix.goos }}" = windows ]; then
            zip -qr "${name}.zip" "$name"
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: md-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            md-cli_*.tar.gz
            md-cli_*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Collect artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Verify archives
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          for f in *.tar.gz; do tar -tzf "$f" >/dev/null; done
          for f in *.zip; do unzip -tq "$f" >/dev/null; done
          echo "archives ok"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          SEMVER: ${{ steps.v.outputs.semver }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease="${{ steps.v.outputs.prerelease }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          args=(--title "md-cli $SEMVER" --generate-notes)
          if [ "$prerelease" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" dist/* "${args[@]}"
